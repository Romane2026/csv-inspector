[project]
name = "csv-inspector"
version = "0.1.0"
description = "A command-line tool to inspect and analyze CSV files"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Romane"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "pandas (<3)",
    "rich (>=15.0.0,<16.0.0)"
]

[project.scripts]
csv-inspector = "csv_inspector.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "csv_inspector", from = "src" }
]

[dependency-groups]
dev = [
    "ruff (>=0.17.6,<0.18.0)",
    "pre-commit (>=4.6,<4.7)",
    "pytest (>=9.2.0,<10.0.0)",
    "pdoc (>=16.0.0,<17.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # Errors and style issues
    "F",  # Pyflakes: logical errors
    "I",  # Import sorting
    "B",  # Bugbear: potential bugs
]

[tool.ruff.format]
quote-style = "double"
